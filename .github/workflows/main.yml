name: Build Taurus Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Find or extract Android project
        id: android-project
        shell: bash
        run: |
          set -euo pipefail

          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE" \
            -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            -not -path "*/build/*" \
            -not -path "*/.gradle/*" \
            -print -quit || true)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android project is not extracted. Looking for ZIP files..."

            EXTRACTION_ROOT="$GITHUB_WORKSPACE/_android_extracted"
            mkdir -p "$EXTRACTION_ROOT"

            ZIP_FOUND="false"
            COUNTER=0

            while IFS= read -r -d '' ZIP_FILE; do
              ZIP_FOUND="true"
              COUNTER=$((COUNTER + 1))

              echo "Extracting: $ZIP_FILE"

              unzip -q -o "$ZIP_FILE" \
                -d "$EXTRACTION_ROOT/package-$COUNTER"
            done < <(
              find "$GITHUB_WORKSPACE" \
                -maxdepth 4 \
                -type f \
                -iname "*.zip" \
                -print0
            )

            if [ "$ZIP_FOUND" = "false" ]; then
              echo "Error: No Android project or ZIP file was found."
              exit 1
            fi

            SETTINGS_FILE="$(find "$EXTRACTION_ROOT" \
              -type f \
              \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
              -not -path "*/build/*" \
              -not -path "*/.gradle/*" \
              -print -quit || true)"
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Error: settings.gradle was not found."
            echo "The uploaded ZIP is not the Taurus Android project."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"

          if [ ! -f "$PROJECT_DIR/app/build.gradle" ] && \
             [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "Error: Android app/build.gradle was not found."
            exit 1
          fi

          echo "Android project found at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            --no-daemon \
            -p "${{ steps.android-project.outputs.dir }}" \
            assembleDebug

      - name: Prepare Taurus APK
        shell: bash
        run: |
          set -euo pipefail

          APK_FILE="$(find \
            "${{ steps.android-project.outputs.dir }}/app/build/outputs/apk/debug" \
            -type f \
            -name "*.apk" \
            -print -quit)"

          if [ -z "$APK_FILE" ]; then
            echo "Error: The APK was not generated."
            exit 1
          fi

          cp "$APK_FILE" "$GITHUB_WORKSPACE/Taurus-Project-Control.apk"

          echo "APK successfully created:"
          ls -lh "$GITHUB_WORKSPACE/Taurus-Project-Control.apk"

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Taurus-Project-Control-Android
          path: Taurus-Project-Control.apk
          if-no-files-found: error
          retention-days: 90
