name: Build Taurus Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Find Android project
        id: android-project
        shell: bash
        run: |
          SETTINGS_FILE="$(find . -name settings.gradle -not -path "*/build/*" -print -quit)"

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Error: settings.gradle was not found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "Android project found at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        shell: bash
        run: |
          gradle --no-daemon \
            -p "${{ steps.android-project.outputs.dir }}" \
            assembleDebug

      - name: Prepare Taurus APK
        shell: bash
        run: |
          cp \
            "${{ steps.android-project.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk" \
            "Taurus-Project-Control.apk"

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Taurus-Project-Control-Android
          path: Taurus-Project-Control.apk
          if-no-files-found: error
          retention-days: 90
