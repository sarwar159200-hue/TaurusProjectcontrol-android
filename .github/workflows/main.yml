name: Build Taurus V25 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build Taurus V25 APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Find or extract Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail

          find_project() {
            find "$1" -type f \( -name settings.gradle -o -name settings.gradle.kts \) \
              -not -path '*/build/*' -print -quit
          }

          SETTINGS_FILE="$(find_project "$GITHUB_WORKSPACE")"

          if [ -z "$SETTINGS_FILE" ]; then
            mkdir -p "$GITHUB_WORKSPACE/_android_extracted"
            package_number=0
            while IFS= read -r -d '' package; do
              package_number=$((package_number + 1))
              destination="$GITHUB_WORKSPACE/_android_extracted/package-$package_number"
              mkdir -p "$destination"
              unzip -q "$package" -d "$destination"
            done < <(find "$GITHUB_WORKSPACE" -maxdepth 4 -type f -iname '*.zip' -print0)
            SETTINGS_FILE="$(find_project "$GITHUB_WORKSPACE/_android_extracted")"
          fi

          if [ -z "$SETTINGS_FILE" ]; then
            echo "Android settings.gradle was not found. Upload this Android project, not the website ZIP." >&2
            exit 1
          fi

          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Android project: $PROJECT_DIR"

      - name: Build debug APK
        run: gradle --no-daemon -p "${{ steps.project.outputs.dir }}" assembleDebug

      - name: Prepare Taurus APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$(find "${{ steps.project.outputs.dir }}" -type f -path '*/build/outputs/apk/debug/*.apk' -print -quit)"
          if [ -z "$APK" ]; then
            echo "The Android build completed but no debug APK was found." >&2
            exit 1
          fi
          cp "$APK" "$GITHUB_WORKSPACE/Taurus-Project-Control-V25.apk"

      - name: Upload downloadable APK
        uses: actions/upload-artifact@v4
        with:
          name: Taurus-Project-Control-V25-Android
          path: Taurus-Project-Control-V25.apk
          if-no-files-found: error
          retention-days: 90
